name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    # 16:00 Asia/Shanghai (08:00 UTC), daily.
    - cron: '0 8 * * *'

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Fetch citation totals
        env:
          GOOGLE_SCHOLAR_ID: ehxjrc8AAAAJ
        run: python3 google_scholar_crawler/main.py --output-dir "$RUNNER_TEMP/scholar-results"
      - name: Publish successful data
        run: |
          if git ls-remote --exit-code --heads origin google-scholar-stats > /dev/null; then
            git fetch origin google-scholar-stats:refs/remotes/origin/google-scholar-stats
            git checkout -B google-scholar-stats origin/google-scholar-stats
          else
            git checkout --orphan google-scholar-stats
            git rm -rf .
          fi
          cp "$RUNNER_TEMP/scholar-results/gs_data.json" gs_data.json
          cp "$RUNNER_TEMP/scholar-results/gs_data_shieldsio.json" gs_data_shieldsio.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Google Scholar citation totals"
          git push origin HEAD:google-scholar-stats
